services:
  - type: web
    name: toaster-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: TOASTER_EARLY_MEMBER_ENABLED
        value: "true"
      - key: TOASTER_JWT_SECRET
        sync: false
      - key: TOASTER_JWT_EXPIRES_DAYS
        value: "30"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false

  - type: cron
    name: toaster-daily-ranking
    runtime: python
    schedule: "0 15 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python snapshot_daily_ranking.py
    envVars:
      - key: DATABASE_URL
        sync: false